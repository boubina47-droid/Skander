<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#100b0d">
    <meta
      name="description"
      content="Download Skander's movie app beta for Windows."
    >
    <title>Skander's movie app (beta for good)</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        --ink: #fff5f3;
        --muted: #c8b7b9;
        --red: #fa3448;
        --red-dark: #8e1527;
        --night: #100b0d;
        --glass: rgb(255 242 242 / 7%);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100svh;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(ellipse at 77% 42%, rgb(111 14 33 / 36%), transparent 40%),
          radial-gradient(ellipse at 5% 90%, rgb(83 17 29 / 23%), transparent 35%),
          linear-gradient(132deg, #100b0d 5%, #1a0b10 53%, #090809 100%);
      }

      a {
        color: inherit;
      }

      .page {
        display: grid;
        min-height: 100svh;
        grid-template-rows: 1fr auto;
        padding: 28px clamp(20px, 5vw, 76px) 24px;
        overflow: hidden;
      }

      .hero {
        display: grid;
        width: min(100%, 1320px);
        min-height: 660px;
        margin: auto;
        grid-template-columns: minmax(0, 1.05fr) minmax(340px, 0.95fr);
        align-items: center;
        gap: clamp(24px, 5vw, 82px);
      }

      .copy {
        position: relative;
        z-index: 1;
        max-width: 700px;
        padding: 50px 0;
      }

      h1 {
        margin: 0;
        font-size: clamp(44px, 5.2vw, 72px);
        font-weight: 780;
        letter-spacing: -0.075em;
        line-height: 0.94;
        text-wrap: balance;
      }

      h1 .beta {
        color: #ff9aa4;
        font-size: 0.54em;
        font-weight: 560;
        letter-spacing: -0.05em;
        white-space: nowrap;
      }

      .intro {
        max-width: 440px;
        margin: 27px 0 30px;
        color: var(--muted);
        font-size: clamp(16px, 1.4vw, 19px);
        line-height: 1.65;
      }

      .download {
        display: inline-flex;
        min-height: 58px;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 0 25px;
        border: 1px solid rgb(255 255 255 / 25%);
        border-radius: 17px;
        color: #fff;
        background:
          linear-gradient(145deg, #ff5360 4%, #ed243d 48%, #b8122d 100%);
        box-shadow:
          inset 0 2px 1px rgb(255 255 255 / 35%),
          inset 0 -5px 10px rgb(90 0 16 / 32%),
          0 12px 30px rgb(210 19 46 / 25%);
        font: inherit;
        font-size: 16px;
        font-weight: 700;
        text-decoration: none;
        transition: transform 180ms ease, filter 180ms ease, box-shadow 180ms ease;
      }

      .download:hover {
        filter: brightness(1.09);
        box-shadow:
          inset 0 2px 1px rgb(255 255 255 / 38%),
          inset 0 -5px 10px rgb(90 0 16 / 32%),
          0 16px 38px rgb(210 19 46 / 38%);
        transform: translateY(-2px);
      }

      .download:active {
        transform: translateY(1px) scale(0.985);
      }

      .download:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 5px;
      }

      .download svg {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
      }

      .file-note {
        margin: 14px 0 0;
        color: #b7a5a8;
        font-size: 14px;
        line-height: 1.6;
      }

      .art-wrap {
        position: relative;
        display: grid;
        min-height: 540px;
        place-items: center;
        perspective: 1100px;
      }

      .glass {
        position: absolute;
        inset: 5% 0 5% 2%;
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 38px;
        background: linear-gradient(145deg, rgb(255 255 255 / 10%), rgb(255 255 255 / 3%));
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 12%);
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
        transform: rotate(3deg);
      }

      .orbit {
        position: absolute;
        width: min(37vw, 430px);
        aspect-ratio: 1;
        border: 1px solid rgb(255 119 133 / 15%);
        border-radius: 50%;
        box-shadow: 0 0 0 34px rgb(255 255 255 / 1.2%), 0 0 0 68px rgb(255 255 255 / 1%);
        transform: rotateX(68deg) rotateZ(-24deg);
      }

      .reel {
        position: relative;
        width: min(73%, 330px);
        aspect-ratio: 0.76;
        transform: rotateY(-15deg) rotateX(5deg) rotateZ(-5deg);
        transform-style: preserve-3d;
        animation: hover-reel 6s ease-in-out infinite;
      }

      .reel-back {
        position: absolute;
        inset: 8% -7% -5% 9%;
        border: 1px solid rgb(255 138 150 / 42%);
        border-radius: 25px;
        background:
          linear-gradient(148deg, #e8384a 0%, #881426 53%, #300d16 100%);
        box-shadow: 19px 24px 0 #430b16, 29px 35px 50px rgb(0 0 0 / 48%);
        transform: translateZ(-18px);
      }

      .reel-front {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: 22px;
        border: 1px solid rgb(255 255 255 / 25%);
        border-radius: 23px;
        background:
          radial-gradient(ellipse at 54% 37%, rgb(255 108 112 / 76%), transparent 28%),
          radial-gradient(ellipse at 50% 42%, #e62840 0%, #7d1326 39%, #260b13 79%);
        box-shadow:
          inset 0 1px 1px rgb(255 255 255 / 30%),
          inset -14px -18px 34px rgb(0 0 0 / 28%),
          0 38px 70px rgb(0 0 0 / 47%);
        transform: translateZ(24px);
      }

      .reel-front::before {
        position: absolute;
        inset: 11px;
        border: 1px solid rgb(255 255 255 / 13%);
        border-radius: 16px;
        content: "";
        pointer-events: none;
      }

      .screen {
        position: relative;
        display: grid;
        width: 100%;
        aspect-ratio: 0.88;
        overflow: hidden;
        place-items: center;
        border: 1px solid rgb(255 255 255 / 17%);
        border-radius: 13px;
        background:
          linear-gradient(163deg, transparent 47%, rgb(20 6 11 / 65%) 48%),
          radial-gradient(ellipse at 49% 31%, #ffc1a8 0 3%, #fa6f65 4% 12%, transparent 13%),
          linear-gradient(120deg, #481020 0%, #d43448 48%, #681326 100%);
        box-shadow: inset 0 0 42px rgb(20 6 11 / 45%);
      }

      .screen::before {
        position: absolute;
        right: 12%;
        bottom: -7%;
        width: 55%;
        height: 59%;
        border-radius: 50% 50% 8% 8%;
        background: linear-gradient(90deg, #250e17, #541420 55%, #1e0a12);
        content: "";
        filter: drop-shadow(0 -10px 24px rgb(255 99 104 / 25%));
        transform: rotate(-10deg);
      }

      .screen::after {
        position: absolute;
        top: 8%;
        left: 10%;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ffe3c5;
        box-shadow: 0 0 22px 10px rgb(255 179 131 / 40%);
        content: "";
      }

      .play {
        z-index: 1;
        display: grid;
        width: 58px;
        aspect-ratio: 1;
        place-items: center;
        padding-left: 4px;
        border: 1px solid rgb(255 255 255 / 32%);
        border-radius: 50%;
        background: rgb(255 248 246 / 17%);
        box-shadow: inset 0 1px 1px rgb(255 255 255 / 45%), 0 9px 23px rgb(0 0 0 / 24%);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
      }

      .play::before {
        width: 0;
        height: 0;
        border-top: 8px solid transparent;
        border-bottom: 8px solid transparent;
        border-left: 12px solid #fff;
        content: "";
      }

      .glint {
        position: absolute;
        top: 13%;
        right: 9%;
        width: 25%;
        height: 54%;
        border-radius: 50%;
        background: rgb(255 185 178 / 18%);
        filter: blur(24px);
        transform: rotate(27deg);
      }

      .ring {
        position: absolute;
        right: 8%;
        bottom: 11%;
        width: 68px;
        aspect-ratio: 1;
        border: 8px solid rgb(255 119 133 / 72%);
        border-radius: 50%;
        box-shadow: inset 0 0 0 8px rgb(69 8 20 / 78%), 0 12px 24px rgb(0 0 0 / 35%);
        transform: translateZ(50px) rotateX(58deg);
      }

      .footer {
        display: flex;
        width: min(100%, 1320px);
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin: 0 auto;
        padding-top: 18px;
        color: #a9979a;
        font-size: 13px;
      }

      .footer p {
        margin: 0;
      }

      .footer a {
        text-decoration-color: rgb(255 255 255 / 40%);
        text-underline-offset: 3px;
      }

      @keyframes hover-reel {
        0%,
        100% {
          transform: translateY(0) rotateY(-15deg) rotateX(5deg) rotateZ(-5deg);
        }

        50% {
          transform: translateY(-11px) rotateY(-12deg) rotateX(7deg) rotateZ(-3deg);
        }
      }

      @media (max-width: 800px) {
        .page {
          min-height: 100svh;
          padding: 18px 22px 20px;
        }

        .hero {
          min-height: 0;
          grid-template-columns: 1fr;
          gap: 0;
          padding: 26px 0 18px;
        }

        .copy {
          padding: 18px 0 0;
        }

        h1 {
          max-width: 620px;
          font-size: clamp(43px, 9.2vw, 68px);
        }

        h1 .beta {
          font-size: 0.5em;
        }

        .intro {
          max-width: 490px;
          margin: 20px 0 22px;
        }

        .art-wrap {
          min-height: 390px;
          margin-top: 5px;
        }

        .glass {
          inset: 4% 2% 5%;
          border-radius: 30px;
        }

        .orbit {
          width: min(64vw, 340px);
        }

        .reel {
          width: min(52%, 250px);
        }

        .footer {
          padding-top: 12px;
        }
      }

      @media (max-width: 430px) {
        .page {
          padding-right: 18px;
          padding-left: 18px;
        }

        h1 {
          font-size: clamp(40px, 10.1vw, 45px);
        }

        .download {
          width: 100%;
        }

        .art-wrap {
          min-height: 330px;
        }

        .reel {
          width: 55%;
        }

        .footer {
          align-items: flex-start;
          flex-direction: column;
          gap: 8px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="hero" aria-labelledby="page-title">
        <div class="copy">
          <h1 id="page-title">Skander's movie app <span class="beta">(beta for good)</span></h1>
          <p class="intro">
            A little rough around the edges. Download the beta and give it a spin.
          </p>
          <a class="download" href="./VyseTV-Setup.exe" download="VyseTV-Setup.exe">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 3.75v10.5m0 0 4-4m-4 4-4-4M5 16v3.25h14V16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Download the beta
          </a>
          <p class="file-note">Windows installer · VyseTV-Setup.exe · 79.1 MB</p>
        </div>

        <div class="art-wrap" role="img" aria-label="A dimensional red movie ticket with a play symbol">
          <div class="glass" aria-hidden="true"></div>
          <div class="orbit" aria-hidden="true"></div>
          <div class="reel" aria-hidden="true">
            <div class="reel-back"></div>
            <div class="reel-front">
              <div class="screen"><span class="glint"></span><span class="play"></span></div>
            </div>
            <div class="ring"></div>
          </div>
        </div>
      </section>

      <footer class="footer">
        <p>Made by Skander.</p>
        <a href="./VyseTV-Setup.exe" download="VyseTV-Setup.exe">Get the installer</a>
      </footer>
    </main>
  </body>
</html>
